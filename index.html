<body>
  <main>
    <div class="header">
      <div><div class="eyebrow">A little wish for Seonup</div><h1>김선업님께 보내는 생일 카드</h1><p>열어보면 별빛과 촛불이 차례로 움직입니다.</p></div>

    </div>
    <div class="layout">
      <div class="stage"><canvas id="scene" width="900" height="1200" aria-label="김선업님께 전하는 별빛과 케이크 생일 축하 카드 애니메이션" role="img"></canvas></div>

        <div class="progress" aria-hidden="true"><span id="progress"></span></div>
        <p id="status" class="status" role="status" aria-live="polite">김선업님을 위한 카드가 재생 중입니다.</p>
        <p class="footnote">영상 저장은 최신 Chrome·Edge에서 WebM 파일로 지원합니다.</p>
      </section>
    </div>
  </main>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d', { alpha: false });
    const replayButton = document.getElementById('replay');
    const pauseButton = document.getElementById('pause');
    const downloadButton = document.getElementById('download');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const W = 900, H = 900, DURATION = 12;
    const TAU = Math.PI * 2;
    let time = 0, previous = 0, playing = true, recording = false, recorder = null;
    let lastStatus = '';
    const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
    const smooth = (a, b, t) => { const v = clamp((t - a) / (b - a)); return v * v * (3 - 2 * v); };
    const easeOut = v => 1 - (1 - clamp(v)) ** 3;
    const easeBack = v => { v = clamp(v); return 1 + 2.5 * (v - 1) ** 3 + 1.5 * (v - 1) ** 2; };
    const fract = n => n - Math.floor(n);
    const hash = n => fract(Math.sin(n * 127.17 + 18.79) * 43758.5453);
    const rgba = (hex, a) => { const h = hex.replace('#', ''); const n = parseInt(h, 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
    function setStatus(message) { if (message !== lastStatus) { status.textContent = message; lastStatus = message; } }
    function roundedRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
    function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
    function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
    function line(x1, y1, x2, y2, color, width = 2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke(); }
    function text(str, x, y, size, color, align = 'center', weight = 700, alpha = 1, maxWidth) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.font = `${weight} ${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
      ctx.textAlign = align; ctx.textBaseline = 'middle';
      if (maxWidth === undefined) ctx.fillText(str, x, y); else ctx.fillText(str, x, y, maxWidth);
      ctx.restore();
    }
    const stars = Array.from({ length: 88 }, (_, i) => ({ x: 30 + hash(i + 1) * 840, y: 24 + hash(i + 101) * 480, r: 1 + hash(i + 204) * 2.1, phase: hash(i + 305) * TAU }));
    const confetti = Array.from({ length: 105 }, (_, i) => ({ x: hash(i + 401) * W, delay: hash(i + 515) * 2.4, speed: 80 + hash(i + 607) * 110, drift: (hash(i + 711) - .5) * 85, rot: hash(i + 812) * TAU, size: 4 + hash(i + 905) * 7, color: ['#f5c77d', '#f4a4aa', '#87c8c4', '#d8c2e8'][i % 4] }));
    function grain() {
      const g = document.createElement('canvas'); g.width = g.height = 220;
      const gc = g.getContext('2d'); const img = gc.createImageData(220, 220);
      for (let i = 0; i < img.data.length; i += 4) { const v = hash(i + 1303) > .55 ? 255 : 0; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 12; }
      gc.putImageData(img, 0, 0); return g;
    }
    const noise = grain();
    function background(t) {
      const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#172039'); grad.addColorStop(.55, '#3a3358'); grad.addColorStop(1, '#68516a');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      const aura = ctx.createRadialGradient(455, 325, 8, 455, 325, 510); aura.addColorStop(0, 'rgba(244,188,139,.26)'); aura.addColorStop(1, 'rgba(244,188,139,0)'); ctx.fillStyle = aura; ctx.fillRect(0, 0, W, H);
      stars.forEach(s => { const a = .28 + .46 * (.5 + .5 * Math.sin(t * 1.5 + s.phase)); circle(s.x, s.y, s.r, `rgba(255,235,209,${a})`); });
      ctx.fillStyle = '#5b4b6b'; ctx.beginPath(); ctx.moveTo(0, 670); ctx.bezierCurveTo(180, 590, 340, 655, 470, 626); ctx.bezierCurveTo(640, 583, 730, 625, 900, 558); ctx.lineTo(900, 900); ctx.lineTo(0, 900); ctx.fill();
      ctx.fillStyle = '#443c5d'; ctx.beginPath(); ctx.moveTo(0, 720); ctx.bezierCurveTo(185, 650, 340, 708, 470, 682); ctx.bezierCurveTo(670, 647, 775, 715, 900, 655); ctx.lineTo(900, 900); ctx.lineTo(0, 900); ctx.fill();
      ctx.fillStyle = '#322e4d'; ctx.fillRect(0, 754, 900, 146);
      ctx.save(); ctx.globalAlpha = .75; ctx.drawImage(noise, 0, 0, W, H); ctx.restore();
    }
    function sparkle(x, y, r, alpha = 1) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = '#fff4d4'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      line(x - r, y, x + r, y, '#fff4d4', 3); line(x, y - r, x, y + r, '#fff4d4', 3);
      circle(x, y, Math.max(1, r * .16), '#fff9df'); ctx.restore();
    }
    function moon(t) {
      const rise = smooth(.2, 1.7, t); const y = 210 + (1 - rise) * 160;
      circle(450, y, 105, 'rgba(255,211,150,.07)'); circle(450, y, 73, 'rgba(255,218,166,.13)');
      circle(450, y, 55, '#f8d39d');
      circle(432, y - 15, 6, '#e9b87f'); circle(476, y + 18, 9, '#e9b87f'); circle(454, y + 36, 4, '#e9b87f');
      circle(434, y + 5, 2.5, '#7c6270'); circle(464, y + 5, 2.5, '#7c6270');
      ctx.beginPath(); ctx.arc(449, y + 13, 7, .1, Math.PI - .1); ctx.strokeStyle = '#7c6270'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    function comet(t) {
      const p = smooth(.9, 3.5, t); if (p <= 0 || p >= 1) return;
      const x = -75 + 1050 * p, y = 460 - 220 * Math.sin(Math.PI * p) - 60 * p;
      ctx.save(); ctx.globalAlpha = Math.sin(Math.PI * p);
      for (let i = 9; i >= 0; i--) { const q = clamp(p - i * .012); const tx = -75 + 1050 * q, ty = 460 - 220 * Math.sin(Math.PI * q) - 60 * q; circle(tx, ty, 3 + (9 - i) * .8, `rgba(251,204,150,${.045 + (9 - i) * .014})`); }
      const glow = ctx.createRadialGradient(x, y, 2, x, y, 60); glow.addColorStop(0, 'rgba(255,239,174,.85)'); glow.addColorStop(1, 'rgba(255,239,174,0)'); circle(x, y, 60, glow); sparkle(x, y, 19); ctx.restore();
    }
    function garland(t) {
      const alpha = smooth(2.5, 3.4, t); if (!alpha) return;
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.moveTo(0, 82); ctx.bezierCurveTo(270, 168, 630, 168, 900, 82); ctx.strokeStyle = '#e9c6aa'; ctx.lineWidth = 3; ctx.stroke();
      for (let i = 0; i < 13; i++) { const x = 34 + i * 69; const y = 91 + 42 * Math.sin(Math.PI * x / 900); ctx.fillStyle = ['#ecc88c', '#dca1ad', '#84bdbc', '#b6a6cd'][i % 4]; ctx.beginPath(); ctx.moveTo(x - 23, y); ctx.lineTo(x + 23, y); ctx.lineTo(x, y + 49); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    function gift(x, y, scale, color) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
      ctx.fillStyle = '#25243855'; ctx.fillRect(-76, 68, 152, 20);
      ctx.fillStyle = color; roundedRect(-63, -48, 126, 115, 8); ctx.fill();
      ctx.fillStyle = '#ffe3ba'; ctx.fillRect(-12, -48, 24, 115); ctx.fillRect(-69, -18, 138, 22);
      ctx.beginPath(); ctx.ellipse(-17, -57, 24, 14, -.45, 0, TAU); ctx.ellipse(17, -57, 24, 14, .45, 0, TAU); ctx.fill();
      circle(0, -54, 8, '#ffe3ba'); ctx.restore();
    }
    function balloon(x, baseY, color, t, phase, scale = 1) {
      const y = baseY - 25 * Math.sin((t - 6) * 1.3 + phase); const sway = 13 * Math.sin(t * .8 + phase);
      ctx.save(); ctx.globalAlpha = smooth(6.5, 7.5, t); ctx.translate(x + sway, y); ctx.scale(scale, scale);
      ctx.beginPath(); ctx.moveTo(0, 85); ctx.bezierCurveTo(-10, 130, 8, 165, -2, 205); ctx.strokeStyle = '#d9bac0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 47, 65, 0, 0, TAU); ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-8, 57); ctx.lineTo(0, 76); ctx.lineTo(8, 57); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-17, -18, 10, 25, -.35, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill(); ctx.restore();
    }
    function cake(t) {
      const p = smooth(3.25, 4.65, t); if (!p) return;
      const offset = (1 - easeBack(p)) * 480;
      ctx.save(); ctx.translate(0, offset);
      ellipse(450, 754, 313, 37, '#28274166');
      ellipse(450, 720, 273, 37, '#cec0ba'); ellipse(450, 711, 271, 36, '#f9e8d1');
      ctx.fillStyle = '#bc7883'; roundedRect(214, 523, 472, 167, [18, 18, 24, 24]); ctx.fill();
      ctx.fillStyle = '#eeb5af'; ctx.fillRect(228, 561, 444, 16); ctx.fillStyle = '#f8c7b8'; ctx.fillRect(228, 623, 444, 13);
      ctx.fillStyle = '#e9a2a5'; roundedRect(206, 508, 488, 79, [28, 28, 12, 12]); ctx.fill();
      ctx.fillStyle = '#fff0d6'; ctx.beginPath(); ctx.moveTo(220, 512); ctx.lineTo(680, 512); ctx.lineTo(680, 540);
      for (let i = 0; i < 8; i++) { const x = 680 - i * 57; ctx.bezierCurveTo(x - 10, 551 + (i % 3) * 6, x - 14, 573 - (i % 2) * 11, x - 29, 555); ctx.bezierCurveTo(x - 39, 541, x - 43, 531, x - 57, 540); }
      ctx.lineTo(220, 512); ctx.fill();
      ellipse(450, 509, 244, 31, '#fff5dd');
      for (let i = 0; i < 23; i++) { const x = 244 + hash(i + 2500) * 410; const y = 528 + hash(i + 2600) * 138; if (y > 545 && y < 655) { ctx.save(); ctx.translate(x, y); ctx.rotate(hash(i + 2700) * 4); roundedRect(-3, -8, 6, 16, 2); ctx.fillStyle = ['#f5d38f', '#e7eef0', '#8dc4bc'][i % 3]; ctx.fill(); ctx.restore(); } }
      for (let i = 0; i < 5; i++) {
        const x = 316 + i * 67, y = 440 + (i % 2) * 8;
        ctx.fillStyle = ['#ebaa9e', '#98c9c3', '#dab8dd', '#f1c17f', '#91b7c9'][i]; roundedRect(x - 8, y, 16, 69, 4); ctx.fill();
        line(x - 8, y + 21, x + 8, y + 21, '#fff2d3', 3); line(x, y - 7, x, y + 2, '#57465b', 3);
        const light = smooth(4.65 + i * .28, 5.05 + i * .28, t);
        if (light) { ctx.save(); ctx.globalAlpha = light; const wobble = Math.sin(t * 10 + i * 2) * 3; const flameY = y - 19; const g = ctx.createRadialGradient(x, flameY, 3, x, flameY, 56); g.addColorStop(0, 'rgba(255,221,139,.56)'); g.addColorStop(1, 'rgba(255,221,139,0)'); circle(x, flameY, 56, g); ctx.beginPath(); ctx.moveTo(x, flameY - 20 + wobble); ctx.bezierCurveTo(x - 17, flameY + 3, x - 7, flameY + 13, x, flameY + 11); ctx.bezierCurveTo(x + 16, flameY + 6, x + 12, flameY - 7, x, flameY - 20 + wobble); ctx.fillStyle = '#ffc064'; ctx.fill(); circle(x, flameY + 1, 5, '#fff2b6'); ctx.restore(); }
      }
      ctx.restore();
    }
    function confettiDraw(t) {
      if (t < 6.6) return;
      ctx.save(); ctx.globalAlpha = smooth(6.6, 7.1, t);
      confetti.forEach((c, i) => { const dt = t - 6.6 - c.delay; if (dt < 0) return; const y = ((dt * c.speed) % 930) - 25; const x = c.x + c.drift * Math.sin(dt * 1.5 + i); ctx.save(); ctx.translate(x, y); ctx.rotate(c.rot + dt * (i % 2 ? 1.5 : -1.5)); ctx.fillStyle = c.color; roundedRect(-c.size / 2, -c.size / 2, c.size, c.size * .64, 1); ctx.fill(); ctx.restore(); });
      ctx.restore();
    }
    function letters(t) {
      if (t < 6.15) return;
      const words = '생일 축하해!';
      ctx.save(); ctx.shadowColor = '#1f203c88'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 8;
      ctx.font = '800 82px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      const chars = [...words], widths = chars.map(ch => ctx.measureText(ch).width + 3); const total = widths.reduce((a, b) => a + b, 0); let x = (W - total) / 2;
      chars.forEach((ch, i) => { const p = smooth(6.2 + i * .1, 6.85 + i * .1, t); ctx.save(); ctx.globalAlpha = p; ctx.translate(x + widths[i] / 2, 310 - 38 * (1 - easeOut(p))); ctx.scale(.65 + .35 * easeBack(p), .65 + .35 * easeBack(p)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff3d9'; ctx.fillText(ch, 0, 0); ctx.restore(); x += widths[i]; });
      ctx.restore();
      const message = '선업아, 오늘은 네가 주인공이야.';
      const p = smooth(7.6, 8.5, t);
      if (p) { ctx.save(); ctx.globalAlpha = p; ctx.shadowColor = '#241e3b'; ctx.shadowBlur = 12; text(message, 450, 803, 32, '#fff2df', 'center', 650, p, 790); ctx.restore(); }
      if (t >= 9.2) { const a = smooth(9.2, 10.2, t) * (.8 + .2 * Math.sin(t * 2)); sparkle(168, 328, 12, a); sparkle(725, 268, 10, a); sparkle(735, 420, 6, a); }
    }
    function intro(t) {
      const a = smooth(.25, 1.1, t) * (1 - smooth(3.25, 3.9, t));
      if (!a) return;
      text('오늘 밤, 별들이 모인 이유', 450, 600, 38, '#fff2de', 'center', 650, a);
      line(350, 650, 550, 650, `rgba(246,208,165,${a * .8})`, 2);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, 1200);
      ctx.fillStyle = '#f4e3ca'; ctx.fillRect(0, 0, W, 1200);
      ctx.fillStyle = '#e8d0ae'; ctx.fillRect(0, 140, W, 10); ctx.fillRect(0, 1050, W, 10);
      text('TO. 김선업', 450, 75, 51, '#47364e', 'center', 800);
      sparkle(173, 76, 14, .7); sparkle(727, 76, 14, .7);
      ctx.save(); ctx.translate(0, 150);
      background(t); moon(t); garland(t); comet(t);
      const giftP = smooth(3.8, 5, t);
      if (giftP) { ctx.save(); ctx.globalAlpha = giftP; gift(102, 756 + (1 - easeOut(giftP)) * 90, .8, '#86b7b3'); gift(788, 761 + (1 - easeOut(giftP)) * 90, .73, '#e6aaab'); ctx.restore(); }
      if (t >= 6.5) { balloon(115, 375, '#e9a5aa', t, .2, .8); balloon(765, 460, '#a7c8c3', t, 1.6, .7); }
      cake(t); confettiDraw(t); intro(t); letters(t);
      ctx.save(); ctx.globalAlpha = .055; ctx.drawImage(noise, 0, 0, W, H); ctx.restore();
      ctx.restore();
      text('선업아, 생일 축하해! 오늘 제일 많이 웃어 😄', 450, 1100, 28, '#493a50', 'center', 650, 1, 820);
      text('찬희가', 758, 1154, 23, '#785e69', 'right', 650);
    }
    function tick(now) {
      if (!previous) previous = now;
      const dt = Math.min((now - previous) / 1000, .08); previous = now;
      if (playing) { time += dt; if (time >= DURATION) { if (recording) { time = DURATION; playing = false; recorder?.stop(); } else time %= DURATION; } }
      draw(time); progress.style.width = `${time / DURATION * 100}%`;
      requestAnimationFrame(tick);
    }
    replayButton.addEventListener('click', () => { time = 0; playing = true; previous = 0; pauseButton.textContent = '일시정지'; setStatus('처음부터 재생 중입니다.'); });
    pauseButton.addEventListener('click', () => { if (recording) return; playing = !playing; pauseButton.textContent = playing ? '일시정지' : '계속 재생'; setStatus(playing ? '재생 중입니다.' : '일시정지했습니다.'); });
    downloadButton.addEventListener('click', () => {
      if (recording) return;
      if (!canvas.captureStream || !window.MediaRecorder) { setStatus('이 브라우저는 영상 저장을 지원하지 않습니다. Chrome 또는 Edge에서 열어주세요.'); return; }
      const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
      if (!mime) { setStatus('WebM 저장을 지원하지 않는 브라우저입니다.'); return; }
      try {
        const stream = canvas.captureStream(30), chunks = [];
        recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5_000_000 });
        recorder.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
        recorder.onerror = () => { recording = false; playing = true; downloadButton.disabled = false; stream.getTracks().forEach(track => track.stop()); setStatus('영상 저장 중 오류가 발생했습니다. 다시 시도해주세요.'); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mime });
          stream.getTracks().forEach(track => track.stop());
          recording = false; downloadButton.disabled = false; playing = true; time = 0;
          if (!blob.size) { setStatus('영상 파일을 만들지 못했습니다. 다시 시도해주세요.'); return; }
          const url = URL.createObjectURL(blob); const link = document.createElement('a');
          link.href = url; link.download = '김선업_생일카드.webm'; document.body.append(link); link.click(); link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60_000);
          setStatus('12초 영상이 저장되었습니다.');
        };
        recording = true; downloadButton.disabled = true; time = 0; previous = 0; playing = true; pauseButton.textContent = '일시정지';
        recorder.start(); setStatus('12초 영상을 만드는 중입니다. 화면을 켜두세요.');
      } catch (error) { recording = false; downloadButton.disabled = false; setStatus('영상 저장을 시작하지 못했습니다. 다른 브라우저에서 다시 시도해주세요.'); }
    });
    draw(0); requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
